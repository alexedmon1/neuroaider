[project]
name = "neuroaider"
version = "0.1.0"
description = "Design matrix and contrast generation for neuroimaging statistics"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alex Edmonston"}
]
requires-python = ">=3.10"
keywords = ["neuroimaging", "fsl", "statistics", "design-matrix", "mri"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/alexedmon1/neuroaider"
Repository = "https://github.com/alexedmon1/neuroaider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuroaider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
